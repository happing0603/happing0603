letter-spacing:-0.03em;text-wrap:balance\">TEAM JCW History<\u002Fh2>\n<ol class=\"tl\">\n<li class=\"tl-item\">\n<div class=\"tl-date\">2023.09 – 2024.10<\u002Fdiv>\n<div class=\"tl-body\">\n<h3>팀 창단 구상 및 초기 대회 출전<\u002Fh3>\n<p>19KOT 출전을 계기로 팀 결성을 기획하고, 22KOT에 참가하며 팀의 기반을 다졌습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li class=\"tl-item\">\n<div class=\"tl-date\">2025.02<\u002Fdiv>\n<div class=\"tl-body\">\n<h3>TEAM PTSD 공식 창단<\u002Fh3>\n<p>인천 송도를 거점으로 공식 창단하여 2025 시즌 팀 킷을 발표하고 코디바이크·IdH WATCH Co. 후원으로 활동을 시작했습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li class=\"tl-item\">\n<div class=\"tl-date\">2025.07 – 2025.08<\u002Fdiv>\n<div class=\"tl-body\">\n<h3>23KOT · 24KOT 출전<\u002Fh3>\n<p>파주 스피드파크 23KOT와 고양특례시장배 24KOT 크리테리움에 출전하며 본격적인 레이스 경험을 쌓았습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li class=\"tl-item\">\n<div class=\"tl-date\">2026.03 – 2026.05<\u002Fdiv>\n<div class=\"tl-body\">\n<h3>TEAM JCW 리브랜딩 및 25KOT 출전<\u002Fh3>\n<p>TEAM JCW로 팀명을 변경하고 벨로케어(VELO CARE) 파트너십 체결, 신규 팀 킷 발표와 함께 25KOT(케이린·제외경기)에 출전했습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<li class=\"tl-item\">\n<div class=\"tl-date\">2026.08<\u002Fdiv>\n<div class=\"tl-body\">\n<h3>26KOT 출전 및 주요 성과<\u002Fh3>\n<p>파주 스피드파크 26KOT에 출전해 고등부 폴포지션 맨 앞 그리드 6인에 합류하며 경쟁력을 입증했습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sponsor\" style=\"border-top: 1px solid rgba(11,11,15,0.14)\">\n<div style=\"max-width:1120px;margin:0 auto;padding:0 24px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:40px 64px;padding-top:128px;padding-bottom:136px\">\n<div class=\"eyebrow\" style=\"flex:0 0 160px\"><b>Sponsor<\u002Fb><span>스폰서<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:20px;max-width:680px\">\n<h2 style=\"margin:0;font-size:clamp(30px,4.2vw,48px);line-height:1.25;font-weight:700;letter-spacing:-0.02em;text-wrap:balance\">SPONSOR<\u002Fh2>\n<p style=\"mar }\nif (n >= steps) {\nclearInterval(iv);\na.pause();\n}\n}, 60);\n}\nstartTimer() {\nthis.stopTimer();\nthis.timer = setInterval(() => {\nthis.setState({ idx: this.state.idx === 0 ? 1 : 0 });\n}, 20000);\n}\nstopTimer() {\nif (this.timer) {\nclearInterval(this.timer);\nthis.timer = null;\n}\n}\nselect(i) {\nif (this.state.idx !== i) {\nthis.setState({ idx: i });\n}\nthis.startTimer();\n}\nremaining() {\nreturn new Date('2027-05-31T23:59:59+09:00').getTime() - this.state.now;\n}\ncountText() {\nconst t = Math.max(0, this.remaining());\nconst pad = (n) => String(n).padStart(2, '0');\nreturn Math.floor(t / 86400000) + '일 ' + pad(Math.floor((t % 86400000) / 3600000)) + '시간 ' + pad(Math.floor((t % 3600000) / 60000)) + '분 ' + pad(Math.floor((t % 60000) / 1000)) + '초';\n}\ntoggleMusic() {\nif (!this.audio) {\nreturn;\n}\nif (this.state.playing) {\nthis.audio.pause();\nthis.setState({ playing: false });\n} else {\nif (this.fadeIv) {\nclearInterval(this.fadeIv);\nthis.fadeIv = null;\n}\ntry {\nthis.audio.volume = 0.7;\n} catch (e) {\n}\nconst p = this.audio.play();\nthis.setState({ playing: true });\nif (p && p.catch) {\np.catch(() => {\nthis.setState({ playing: false });\n});\n}\n}\n}\nrenderVals() {\nconst idx = this.state.idx;\nconst playing = this.state.playing;\nreturn {\nisA: idx === 0,\nisB: idx === 1,\nbOpacity: idx === 1 ? 1 : 0,\naLabelOpacity: idx === 0 ? 1 : 0.4,\nbLabelOpacity: idx === 1 ? 1 : 0.4,\nnext: () => this.select(this.state.idx === 0 ? 1 : 0),\ngoA: () => this.select(0),\ngoB: () => this.select(1),\nisPlaying: playing,\nrecruiting: this.remaining() > 0,\ncountText: this.countText(),\nisPaused: !playing,\nmusicLabel: playing ? '음악 끄기' : '음악 켜기',\nmusicPressed: playing,\nlabelMax: playing ? 'min(340px, calc(100vw - 112px))' : '0px',\nlabelOpacity: playing ? 1 : 0,\nlabelPadLeft: playing ? '20px' : '0px',\ntoggleMusic: () => this.toggleMusic(),\ngoApply: () => this.fadeOut()\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
